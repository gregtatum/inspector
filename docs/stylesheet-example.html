<!DOCTYPE html>
<html class='theme-light'>
  <head>
    <meta charset="utf-8">
    <title>Inspector</title>
    <style id="page-style">
      .page-container {
        background-color:#fff;
        top: 0;
        left: 0;
        right: 40%;
        bottom: 0;
        position: absolute;
      }

      .page-container > * {
        float: left;
        width: 50px;
        height: 50px;
        background-color:#333;
        margin: 1em;
      }

      .red-box {
        background-color:#f00;
      }

      .blue-box {
        background-color:#04f;
      }
    </style>
  </head>
  <body>
    <div class='page-container'>
      <div></div>
      <div></div>
      <div class='red-box'></div>
      <div class='blue-box'></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
